services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clinical_reviews
      POSTGRES_USER: clinical
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinical -d clinical_reviews"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://clinical:${POSTGRES_PASSWORD:-local-demo-only}@db:5432/clinical_reviews
      CORS_ORIGINS: http://localhost:8080
      OCR_SPACE_API_KEY: ${OCR_SPACE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-3.6-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      MAX_UPLOAD_MB: 10
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "8080:80"
    depends_on:
      - backend
volumes:
  pgdata:
